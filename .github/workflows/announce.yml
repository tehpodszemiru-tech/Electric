name: Анонс статьи в соцсети

# Срабатывает, когда в main попадает новый/изменённый анонс (то есть после слияния PR со статьёй).
on:
  push:
    branches: [main]
    paths:
      - "_blog/announce/*.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: announce
  cancel-in-progress: false

jobs:
  announce:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Опубликовать анонсы
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          VK_GROUP_TOKEN: ${{ secrets.VK_GROUP_TOKEN }}
          VK_GROUP_ID: ${{ secrets.VK_GROUP_ID }}
        run: python3 tools/announce.py
      - name: Запомнить, что опубликовано
        if: always()
        run: |
          if [ -n "$(git status --porcelain _blog/announce/posted.json)" ]; then
            git config user.name "blog-bot"
            git config user.email "blog-bot@users.noreply.github.com"
            git add _blog/announce/posted.json
            git commit -m "blog: отметка об опубликованных анонсах [skip ci]"
            git pull --rebase -q
            git push
          fi
