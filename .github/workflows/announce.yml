name: Анонс статьи в соцсети

# Срабатывает, когда в main попадает новый/изменённый анонс (то есть после слияния PR со статьёй).
on:
  push:
    branches: [main]
    paths:
      - "_blog/announce/*.json"
      - "!_blog/announce/posted.json"
  workflow_dispatch:
    inputs:
      slug:
        description: "slug статьи (пусто — все, кому нужна отправка)"
        required: false
        type: string
      republish:
        description: "Переопубликовать в ТГ/ВК даже без смены social_version"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: announce
  cancel-in-progress: false

jobs:
  announce:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Сброс отметки для принудительной переотправки
        if: github.event_name == 'workflow_dispatch' && inputs.republish && inputs.slug
        run: |
          python3 <<'PY'
          import json
          from pathlib import Path
          p = Path("_blog/announce/posted.json")
          posted = json.loads(p.read_text(encoding="utf-8")) if p.exists() else {}
          slug = "${{ inputs.slug }}"
          rec = posted.setdefault(slug, {})
          rec.pop("telegram", None)
          rec.pop("vk", None)
          p.write_text(json.dumps(posted, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
      - name: Опубликовать анонсы
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          VK_GROUP_TOKEN: ${{ secrets.VK_GROUP_TOKEN }}
          VK_GROUP_ID: ${{ secrets.VK_GROUP_ID }}
          REPUBLISH_SLUG: ${{ github.event_name == 'workflow_dispatch' && inputs.slug || '' }}
          FORCE_REPOST: ${{ github.event_name == 'workflow_dispatch' && inputs.republish && '1' || '0' }}
        run: python3 tools/announce.py
      - name: Запомнить, что опубликовано
        if: always()
        run: |
          if [ -n "$(git status --porcelain _blog/announce/posted.json)" ]; then
            git config user.name "blog-bot"
            git config user.email "blog-bot@users.noreply.github.com"
            git add _blog/announce/posted.json
            git commit -m "blog: отметка об опубликованных анонсах [skip ci]"
            git pull --rebase -q
            # Даём GitHub Pages завершить деплой статьи, иначе ловим «deployment in progress».
            sleep 150
            git push
          fi
